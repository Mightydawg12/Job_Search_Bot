name: Job alert bot

on:
  schedule:
    # Hourly from ~5am to ~10pm Pacific (13:00–06:00 UTC). GitHub may start runs a few minutes late.
    - cron: "17 0-6,13-23 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

permissions:
  contents: write   # lets the bot save state/seen_jobs.json back to the repo

concurrency:
  group: job-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Find jobs & send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/bot.py

      - name: Save seen jobs
        run: |
          git config user.name  "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git pull --rebase --quiet && git push
